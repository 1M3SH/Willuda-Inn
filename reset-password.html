<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Willuda Inn</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/reset-password.css">
</head>

<body>
    <main class="reset-page">
        <a class="brand" href="index.html" aria-label="Willuda Inn home page">
            <span class="brand-mark"><i class="fa-solid fa-hotel"></i></span>
            <span>Willuda <em>Inn</em></span>
        </a>

        <section class="reset-card" aria-labelledby="resetTitle">
            <div class="security-icon" aria-hidden="true"><i class="fa-solid fa-shield-halved"></i></div>
            <span class="eyebrow">Account recovery</span>
            <h1 id="resetTitle">Set a new password</h1>
            <p class="intro">Choose a strong password you do not use for any other account.</p>

            <div id="resetMessage" class="form-message" role="alert" aria-live="polite" hidden></div>

            <form id="resetPasswordForm" novalidate>
                <div class="form-group">
                    <label for="newPassword">New password</label>
                    <div class="password-field">
                        <i class="fa-solid fa-key field-icon" aria-hidden="true"></i>
                        <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" placeholder="Create a new password" required>
                        <button class="toggle-password" type="button" data-target="newPassword" aria-label="Show new password"><i class="fa-solid fa-eye"></i></button>
                    </div>
                    <small class="field-error" id="newPasswordError"></small>
                </div>

                <div class="strength" aria-live="polite">
                    <div class="strength-header"><span>Password strength</span><strong id="strengthText">Not entered</strong></div>
                    <div class="strength-track"><span id="strengthFill" class="strength-fill"></span></div>
                </div>

                <ul class="requirements" aria-label="Password requirements">
                    <li id="lengthRule"><i class="fa-regular fa-circle"></i> At least 8 characters</li>
                    <li id="upperRule"><i class="fa-regular fa-circle"></i> One uppercase letter</li>
                    <li id="lowerRule"><i class="fa-regular fa-circle"></i> One lowercase letter</li>
                    <li id="numberRule"><i class="fa-regular fa-circle"></i> One number</li>
                    <li id="specialRule"><i class="fa-regular fa-circle"></i> One special character</li>
                </ul>

                <div class="form-group">
                    <label for="confirmPassword">Confirm new password</label>
                    <div class="password-field">
                        <i class="fa-solid fa-lock field-icon" aria-hidden="true"></i>
                        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Re-enter your new password" required>
                        <button class="toggle-password" type="button" data-target="confirmPassword" aria-label="Show confirmation password"><i class="fa-solid fa-eye"></i></button>
                    </div>
                    <small class="field-error" id="confirmPasswordError"></small>
                </div>

                <button id="resetButton" class="submit-button" type="submit">Reset Password <i class="fa-solid fa-arrow-right"></i></button>
            </form>

            <p class="back-login"><a href="login.html"><i class="fa-solid fa-arrow-left"></i> Back to login</a></p>
        </section>
    </main>

    <script src="assets/js/reset-password.js"></script>
</body>

</html>
