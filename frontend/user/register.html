<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Create Account | Willuda Inn</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Cormorant+Garamond:wght@600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet"
href="assets/css/register.css">

</head>

<body>

<div class="register-container">

<div class="left-panel">

<div class="overlay"></div>

<div class="content">

<h1>Willuda Inn</h1>

<h2>Create Your Account</h2>

<p>

Join Willuda Inn and enjoy luxury accommodation,
easy online booking and event reservations.

</p>

</div>

</div>

<div class="right-panel">

<div class="form-box">

<a href="login.html"
class="back">

<i class="fa-solid fa-arrow-left"></i>

Back to Login

</a>

<h2>Create Account</h2>

<form id="registerForm">

<div class="input-box">

<input
type="text"
id="fullname"
placeholder="Full Name">

</div>

<div class="input-box">

<input
type="email"
id="email"
placeholder="Email Address">

</div>

<div class="input-box">

<input
type="password"
id="password"
placeholder="Password">

</div>

<div class="input-box">

<input
type="password"
id="confirm"
placeholder="Confirm Password">

</div>

<button>

Create Account

</button>

<p class="login-link">

Already have an account?

<a href="login.html">

Login

</a>

</p>

</form>

</div>

</div>

</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/register.js"></script>

</body>

</html>
