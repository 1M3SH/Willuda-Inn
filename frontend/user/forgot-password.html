<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password | Willuda Inn</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" href="assets/css/forgot-password.css">

</head>

<body>

<div class="forgot-container">

<div class="forgot-box">

<a href="login.html" class="back">
<i class="fa-solid fa-arrow-left"></i>
Back to Login
</a>

<h2>Forgot Password</h2>

<p>

Enter your registered email address.
We'll send you a password reset link.

</p>

<form id="forgotForm">

<div class="input-box">

<i class="fa-regular fa-envelope"></i>

<input
type="email"
id="email"
placeholder="Enter Email Address">

</div>

<button>

Send Reset Link

</button>

</form>

</div>

</div>

<script src="assets/js/forgot-password.js"></script>

</body>
