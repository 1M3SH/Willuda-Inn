<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>New Booking | Willuda Inn</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Cormorant+Garamond:wght@600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- Booking CSS -->
    <link
        rel="stylesheet"
        href="assets/css/booking.css"
    >
</head>

<body>

    <!-- =========================
         PAGE HEADER
    ========================== -->
    <header class="page-header">

        <a href="dashboard.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
            Dashboard
        </a>

        <h1>Book Your Stay</h1>

        <p>
            Reserve your preferred room or event venue easily.
        </p>

    </header>

    <!-- =========================
         BOOKING CONTENT
    ========================== -->
    <main class="booking-container">

        <!-- =========================
             LEFT SIDE - BOOKING FORM
        ========================== -->
        <section class="booking-form">

            <h2>Booking Details</h2>

            <form id="bookingForm" novalidate>

                <!-- Facility Selection -->
                <div class="form-group">

                    <label for="facility">
                        Facility
                    </label>

                    <select
                        id="facility"
                        name="facility"
                        required
                    >
                        <option value="">
                            Select Facility
                        </option>

                        <option value="Luxury Deluxe Room">
                            Luxury Deluxe Room
                        </option>

                        <option value="Standard Room">
                            Standard Room
                        </option>

                        <option value="Family Suite">
                            Family Suite
                        </option>

                        <option value="Wedding Hall">
                            Wedding Hall
                        </option>

                        <option value="Conference Hall">
                            Conference Hall
                        </option>

                        <option value="Garden Area">
                            Garden Area
                        </option>
                    </select>

                </div>

                <!-- Check-in and Check-out Dates -->
                <div class="row">

                    <div class="form-group">

                        <label for="checkin">
                            Check In
                        </label>

                        <input
                            type="date"
                            id="checkin"
                            name="checkin"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="checkout">
                            Check Out
                        </label>

                        <input
                            type="date"
                            id="checkout"
                            name="checkout"
                            required
                        >

                    </div>

                </div>

                <!-- Adults and Children -->
                <div class="row">

                    <div class="form-group">

                        <label for="adults">
                            Adults
                        </label>

                        <select
                            id="adults"
                            name="adults"
                            required
                        >
                            <option value="1">1 Adult</option>
                            <option value="2">2 Adults</option>
                            <option value="3">3 Adults</option>
                            <option value="4">4 Adults</option>
                            <option value="5">5 Adults</option>
                        </select>

                    </div>

                    <div class="form-group">

                        <label for="children">
                            Children
                        </label>

                        <select
                            id="children"
                            name="children"
                        >
                            <option value="0">No Children</option>
                            <option value="1">1 Child</option>
                            <option value="2">2 Children</option>
                            <option value="3">3 Children</option>
                            <option value="4">4 Children</option>
                        </select>

                    </div>

                </div>

                <!-- Special Requests -->
                <div class="form-group">

                    <label for="request">
                        Special Request
                    </label>

                    <textarea
                        id="request"
                        name="request"
                        rows="4"
                        placeholder="Enter any special requirements..."
                    ></textarea>

                </div>

                <hr>

                <!-- =========================
                     CUSTOMER INFORMATION
                ========================== -->
                <h2>Customer Information</h2>

                <!-- Full Name -->
                <div class="form-group">

                    <label for="fullname">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                </div>

                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >

                </div>

                <!-- Phone Number -->
                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        autocomplete="tel"
                        required
                    >

                </div>

                <!-- Address -->
                <div class="form-group">

                    <label for="address">
                        Address
                    </label>

                    <textarea
                        id="address"
                        name="address"
                        rows="3"
                        placeholder="Enter your address"
                        autocomplete="street-address"
                        required
                    ></textarea>

                </div>

                <!-- Form Buttons -->
                <div class="buttons">

                    <a
                        href="dashboard.html"
                        class="cancel-btn"
                    >
                        Cancel
                    </a>

                    <button type="submit">
                        <i class="fa-solid fa-calendar-check"></i>
                        Confirm Booking
                    </button>

                </div>

            </form>

        </section>

        <!-- =========================
             RIGHT SIDE - SUMMARY
        ========================== -->
        <aside class="summary">

            <h2>Booking Summary</h2>

            <div class="summary-box">

                <div class="item">

                    <span>Facility</span>

                    <strong id="facilityName">
                        Not Selected
                    </strong>

                </div>

                <div class="item">

                    <span>Price Per Night</span>

                    <strong id="roomPrice">
                        $0.00
                    </strong>

                </div>

                <div class="item">

                    <span>Number of Nights</span>

                    <strong id="nights">
                        0
                    </strong>

                </div>

                <div class="item">

                    <span>Subtotal</span>

                    <strong id="subtotal">
                        $0.00
                    </strong>

                </div>

                <div class="item">

                    <span>Service Charge</span>

                    <strong id="service">
                        $0.00
                    </strong>

                </div>

                <div class="item">

                    <span>Tax</span>

                    <strong id="tax">
                        $0.00
                    </strong>

                </div>

                <hr>

                <div class="item total">

                    <span>Total</span>

                    <strong id="total">
                        $0.00
                    </strong>

                </div>

            </div>

        </aside>

    </main>

    <!-- Booking Success / Error Message -->
    <div
        class="booking-message"
        id="bookingMessage"
        role="alert"
        aria-live="polite"
    ></div>

    <!-- Configuration & Booking JavaScript -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/booking.js"></script>

</body>

</html>
